<title>Dapur Panas: Kitchen Rush</title>
<style>
  html, body {
    margin: 0;

    height: 100%;
    overflow: hidden;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: system-ui, sans-serif;

  #wrap {
    width: min(100vw, calc(100vh * 1280 / 720));

  canvas {
    display: block;
    width: 100%;
    height: 100%;
    background: #e8dcc8;
    cursor: pointer;
  }
</style>
